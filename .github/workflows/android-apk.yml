name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest ships the Android SDK (ANDROID_HOME is preset); Gradle fetches any missing parts.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Build release APK
        working-directory: android
        # arm64 only keeps the build fast and the APK small; it covers almost every phone from the last ~8 years.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/OpenTimeWindow-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenTimeWindow-apk
          path: dist/*.apk

      # A release gives a direct download link that works from a phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OpenTimeWindow build ${{ github.run_number }}
          body: |
            Test build from commit ${{ github.sha }}.
            Download the .apk below on your Android phone and open it to install (allow "install unknown apps" when asked).
          files: dist/*.apk
          prerelease: true
